name: Uptime Monitor

# Active monitoring: checks the live /health endpoint every 30 minutes.
# If the site or its database is down the run fails and GitHub emails the owner.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check /health
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::Repository variable APP_URL is not set, nothing to check."
            exit 0
          fi
          # A sleeping free-tier service needs about a minute to wake up, so retry.
          body=$(curl -fsS --retry 5 --retry-delay 20 --retry-all-errors \
                      --max-time 60 "$APP_URL/health")
          echo "$body"
          echo "$body" | jq -e '.status == "ok" and .database == "up"' > /dev/null
